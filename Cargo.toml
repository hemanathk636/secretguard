[package]
name = "secretguard"
version = "0.1.7"
edition = "2021"
authors = ["SecretGuard Team"]
description = "Sub-millisecond terminal secret interceptor and privacy guard for developers and AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hemanathk636/secretguard"
homepage = "https://hemanathk636.github.io/secretguard/"
documentation = "https://docs.rs/secretguard"
readme = "README.md"
keywords = ["security", "cli", "terminal", "secret-scanner", "privacy"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
regex = "1.10"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
sha2 = "0.10"

[lib]
name = "secretguard"
path = "src/lib.rs"

[[bin]]
name = "secretguard"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
