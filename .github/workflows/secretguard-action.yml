name: SecretGuard Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan:
    name: SecretGuard Native Scan & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run SecretGuard Action
        uses: ./
        with:
          path: "."
          audit-compliance: "true"
          radar: "true"
