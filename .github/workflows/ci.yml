name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Code Quality & Clippy Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@a54c7fe936aacc4bb337475eaaabe6bb01619829 # stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9efb21c75757962410a58a9e0 # v2.7.7

      - name: Verify formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test Matrix (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@a54c7fe936aacc4bb337475eaaabe6bb01619829 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9efb21c75757962410a58a9e0 # v2.7.7

      - name: Run Full Workspace Test Suite
        run: cargo test --verbose

      - name: Run Diagnostics (secretguard doctor)
        run: cargo run -- doctor

      - name: Run Codebase Scanner (secretguard scan Cargo.toml)
        run: cargo run -- scan Cargo.toml

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Security audit with rustsec
        uses: rustsec/audit-check@287a637d451a9ad9c0717551061972b22ec3ab40 # v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
