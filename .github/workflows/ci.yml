name: CI

on:
  push:
    branches: [ main, "security/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy linter (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Full Workspace Test Suite
        run: cargo test --all --quiet

      - name: Run Diagnostics (secretguard doctor)
        run: cargo run --locked -- doctor

      - name: Run Codebase Scanner (secretguard scan Cargo.toml)
        run: cargo run --locked -- scan Cargo.toml

  supply-chain:
    name: Dependency & License Audit (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: RustSec Vulnerability Audit (cargo-audit)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: License & Dependency Policy Check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
