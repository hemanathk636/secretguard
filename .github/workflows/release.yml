name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Pre-Release Quality & Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy linter (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --verbose -- --test-threads=1

  build:
    name: Build - ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: secretguard
            archive: secretguard-aarch64-apple-darwin.tar.gz

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: secretguard
            archive: secretguard-x86_64-apple-darwin.tar.gz

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: secretguard
            archive: secretguard-x86_64-unknown-linux-gnu.tar.gz

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: secretguard.exe
            archive: secretguard-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.archive }} ${{ matrix.bin }}
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          else
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          fi

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Set-Content -Path "${{ matrix.archive }}.sha256"

      - name: Generate build provenance attestation (Sigstore / SLSA)
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebfbca1a335a31df # v2.2.3
        with:
          subject-path: ${{ matrix.archive }}

      - name: Upload release assets
        uses: softprops/action-gh-release@c062e496a77d2426618797b5e408544c77ea1a6a # v2.0.8
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
